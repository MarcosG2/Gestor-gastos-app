<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #cbd5e1; font-family: Inter, sans-serif; color: #1f2937; }
  .app { display: grid; grid-template-columns: 240px 1fr; height: 900px; }
  nav { background: #fff; padding: 24px 16px; }
  nav strong { color: #4f46e5; display: block; margin-bottom: 24px; }
  nav div { padding: 10px 12px; border-radius: 12px; color: #64748b; font-weight: 600; font-size: 14px; }
  nav .on { background: #eef2ff; color: #4f46e5; }
  main { padding: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: #fff; border-radius: 24px; padding: 24px; box-shadow: 0 12px 30px rgba(0,0,0,.08); }
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .m { color: #fff; border-radius: 16px; padding: 16px; }
  .m b { display: block; font-size: 22px; margin-top: 6px; }
  input, button { width: 100%; margin-top: 8px; }
  input { border: 0; background: #f3f4f6; border-radius: 12px; padding: 12px; }
  button { background: #4f46e5; color: #fff; border: 0; border-radius: 12px; padding: 14px; font-weight: 700; }
  li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; list-style: none; }
  ul { padding: 0; }
</style>
</head>
<body>
<div class="app">
  <nav>
    <strong>Gestor</strong>
    <div class="on">Panel</div><div>Historial</div><div>Presupuestos</div><div>Recurrentes</div><div>Metas</div><div>Visualizador</div><div>Categorías</div><div>Mi Perfil</div>
  </nav>
  <main>
    <div class="card">
      <h2 style="margin-bottom:12px">Registrar gasto</h2>
      <input value="$ 8900" /><input value="Verdulería" />
      <button>Guardar</button>
    </div>
    <div>
      <div class="metrics">
        <div class="m" style="background:linear-gradient(#059669,#065f46)"><span>Ingresos</span><b>$420.000</b></div>
        <div class="m" style="background:linear-gradient(#e11d48,#9f1239)"><span>Gastos</span><b>$235.680</b></div>
        <div class="m" style="background:linear-gradient(#4f46e5,#312e81)"><span>Balance</span><b>$184.320</b></div>
      </div>
      <div class="card">
        <ul>
          <li><span>Verdulería</span><span>−$8.900</span></li>
          <li><span>Subte</span><span>−$1.250</span></li>
          <li><span>Sueldo</span><span>+$420.000</span></li>
        </ul>
      </div>
    </div>
  </main>
</div>
</body>
</html>
